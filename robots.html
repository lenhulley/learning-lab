<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robotbandet · Learning Lab</title>
<link rel="stylesheet" href="./robots.css?v=stage">
<script defer src="./robots.js?v=stage"></script>
</head>
<body>
<main>
  <header><a id="back" href="./?age=5">← Learning Lab</a><button id="language">SV / EN</button></header>
  <div class="headline">
    <p id="eyebrow">✦ LEARNING LAB / 5+</p>
    <h1 id="title">Robotbandet</h1>
  </div>
  <p id="intro">Varje robot spelar två slag!</p>
  <div class="theatre">
    <div class="lights" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <section id="stage" aria-label="Scen"></section>
    <div class="score">
      <div id="count-track" aria-hidden="true"></div>
      <p id="total" aria-live="polite"></p>
    </div>
  </div>
  <div class="controls">
    <button id="add">＋ Robot</button>
    <button id="remove">− Robot</button>
    <button id="play">▶ Spela!</button>
    <button id="challenge">★ Utmaning</button>
  </div>
  <section id="challenge-panel" hidden>
    <div id="target" aria-hidden="true"></div>
    <p id="prompt" role="status"></p>
    <button id="next-challenge" hidden></button>
  </section>
  <button id="listen">◖)) Läs upp</button>
</main>
</body>
</html>
